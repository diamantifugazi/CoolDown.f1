# ============================================================
# CoolDown F1 — Decap CMS Configuration (Cloudflare Pages + GitHub OAuth)
# ============================================================
# Documentazione: https://decapcms.org/docs/

backend:
  name: github
  repo: diamantifugazi/CoolDown.f1
  branch: main
  base_url: https://cooldown-f1-oauth.YOUR-SUBDOMAIN.workers.dev
  # ⬆️ DA SOSTITUIRE col tuo Worker URL dopo averlo creato.
  # Esempio finale: https://cooldown-f1-oauth.davidebianchi.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: 'Articolo: nuovo "{{slug}}"'
    update: 'Articolo: aggiornato "{{slug}}"'
    delete: 'Articolo: eliminato "{{slug}}"'
    uploadMedia: 'Media: upload "{{path}}"'
    deleteMedia: 'Media: eliminato "{{path}}"'

# Workflow editoriale: ogni modifica passa per uno stato di revisione
# prima di essere pubblicata. Dashboard → "Workflow" per vederli.
publish_mode: editorial_workflow

# Dove vanno salvate le immagini caricate dal CMS
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Lingua dell'interfaccia
locale: 'it'

# Visualizzazione del sito dal CMS (link "View Live")
site_url: https://cooldown-f1.pages.dev
display_url: https://cooldown-f1.pages.dev
logo_url: ""

# ============================================================
# COLLEZIONI
# ============================================================
collections:

  - name: "articles"
    label: "Articoli"
    label_singular: "Articolo"
    description: "Tutti gli articoli pubblicati sul sito. Compila i campi e poi salva: l'admin riceverà la richiesta di pubblicazione."
    folder: "content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} · {{tag}} · {{date | date('DD.MM.YY')}}"
    sortable_fields: ['date', 'title', 'tag']

    view_filters:
      - label: "📰 Analisi"
        field: tag
        pattern: "Analisi"
      - label: "⚙️ Tech"
        field: tag
        pattern: "Tech"
      - label: "📖 Storia"
        field: tag
        pattern: "Storia"
      - label: "🎬 Cultura"
        field: tag
        pattern: "Cultura"
      - label: "💬 Opinione"
        field: tag
        pattern: "Opinione"
      - label: "📊 Data"
        field: tag
        pattern: "Data"
      - label: "📚 Long-form"
        field: tag
        pattern: "Long-form"

    view_groups:
      - label: "Per categoria"
        field: tag
      - label: "Per anno"
        field: date
        pattern: \d{4}

    fields:

      - label: "Titolo"
        name: "title"
        widget: "string"
        required: true
        hint: "Il titolo dell'articolo. Sarà mostrato grande nelle card e nella pagina articolo."

      - label: "Categoria"
        name: "tag"
        widget: "select"
        required: true
        default: "Analisi"
        options:
          - "Analisi"
          - "Tech"
          - "Storia"
          - "Cultura"
          - "Opinione"
          - "Data"
          - "Long-form"
        hint: "Determina dove l'articolo appare nella pagina Articoli (raggruppato per categoria)."

      - label: "Data di pubblicazione"
        name: "date"
        widget: "datetime"
        required: true
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: false
        hint: "Determina anche l'ordinamento: gli articoli più recenti compaiono per primi."

      - label: "Tempo di lettura"
        name: "read"
        widget: "string"
        required: false
        default: "5 min"
        hint: 'Es: "6 min", "11 min". Mostrato nelle card.'

      - label: "Sommario"
        name: "excerpt"
        widget: "string"
        required: true
        pattern: ['^.{20,250}$', 'Deve essere lungo tra 20 e 250 caratteri']
        hint: "Una frase di apertura mostrata nelle card e sotto al titolo nella pagina articolo. Max ~250 caratteri."

      - label: "Cover image"
        name: "cover"
        widget: "image"
        required: false
        media_library:
          config:
            multiple: false
        hint: "Immagine di copertina dell'articolo. Consigliato: orizzontale (16:9 o 16:10), almeno 1200px di larghezza, max 400 KB. Se vuoto, viene usato uno stile grafico astratto (vedi sotto)."

      - label: "Stile grafico di fallback"
        name: "variant"
        widget: "select"
        required: false
        default: "ac-v0"
        options:
          - { label: "Halftone diagonale (blu)", value: "ac-v0" }
          - { label: "Halftone centrato (nero)", value: "ac-v1" }
          - { label: "Halftone verticale (rosso)", value: "ac-v2" }
        hint: "Usato SOLO se non hai caricato una cover image. Tre stili grafici brand-coerenti."

      - label: "Corpo dell'articolo"
        name: "body"
        widget: "markdown"
        required: true
        minimal: false
        modes: ['rich_text', 'raw']
        buttons: ['bold', 'italic', 'link', 'heading-two', 'heading-three', 'quote', 'bulleted-list', 'numbered-list']
        editor_components: ['image']
        hint: "Scrivi qui il testo. Usa H2 (##) per i titoli di sezione, H3 (###) per i sottotitoli, **grassetto** per evidenziare."
