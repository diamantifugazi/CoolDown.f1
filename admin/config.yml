backend:
  name: github
  repo: diamantifugazi/CoolDown.f1
  branch: main
  base_url: https://cooldown-f1-oauth.fugazzottodavide.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: 'Articolo: nuovo "{{slug}}"'
    update: 'Articolo: aggiornato "{{slug}}"'
    delete: 'Articolo: eliminato "{{slug}}"'
    uploadMedia: 'Media: upload "{{path}}"'
    deleteMedia: 'Media: eliminato "{{path}}"'

publish_mode: editorial_workflow

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: 'it'

site_url: https://cooldown-f1.pages.dev
display_url: https://cooldown-f1.pages.dev
logo_url: ""

collections:
  - name: "articles"
    label: "Articoli"
    label_singular: "Articolo"
    description: "Tutti gli articoli pubblicati sul sito. Compila i campi e poi salva: l'admin riceverà la richiesta di pubblicazione."
    folder: "content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} · {{tag}} · {{date | date('DD.MM.YY')}}"
    sortable_fields: ['date', 'title', 'tag']

    view_filters:
      - label: "Analisi"
        field: tag
        pattern: "Analisi"
      - label: "Tech"
        field: tag
        pattern: "Tech"
      - label: "Storia"
        field: tag
        pattern: "Storia"
      - label: "Cultura"
        field: tag
        pattern: "Cultura"
      - label: "Opinione"
        field: tag
        pattern: "Opinione"
      - label: "Data"
        field: tag
        pattern: "Data"
      - label: "Long-form"
        field: tag
        pattern: "Long-form"

    fields:
      - label: "Titolo"
        name: "title"
        widget: "string"
        required: true
        hint: "Il titolo dell'articolo. Sarà mostrato grande nelle card e nella pagina articolo."

      - label: "Categoria"
        name: "tag"
        widget: "select"
        required: true
        default: "Analisi"
        options:
          - "Analisi"
          - "Tech"
          - "Storia"
          - "Cultura"
          - "Opinione"
          - "Data"
          - "Long-form"
        hint: "Determina dove l'articolo appare nella pagina Articoli (raggruppato per categoria)."

      - label: "Data di pubblicazione"
        name: "date"
        widget: "datetime"
        required: true
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: false
        hint: "Determina anche l'ordinamento: gli articoli più recenti compaiono per primi."

      - label: "Tempo di lettura"
        name: "read"
        widget: "string"
        required: false
        default: "5 min"
        hint: 'Es: "6 min", "11 min". Mostrato nelle card.'

      - label: "Sommario"
        name: "excerpt"
        widget: "string"
        required: true
        pattern: ['^.{20,250}$', 'Deve essere lungo tra 20 e 250 caratteri']
        hint: "Una frase di apertura mostrata nelle card e sotto al titolo nella pagina articolo. Max ~250 caratteri."

      - label: "Cover image"
        name: "cover"
        widget: "image"
        required: false
        hint: "Immagine di copertina. Consigliato 1200px+ larghezza, max 400KB. Se vuoto, viene usato uno stile grafico astratto."

      - label: "Stile grafico di fallback"
        name: "variant"
        widget: "select"
        required: false
        default: "ac-v0"
        options:
          - label: "Halftone diagonale (blu)"
            value: "ac-v0"
          - label: "Halftone centrato (nero)"
            value: "ac-v1"
          - label: "Halftone verticale (rosso)"
            value: "ac-v2"
        hint: "Usato SOLO se non hai caricato una cover image."

      - label: "Corpo dell'articolo"
        name: "body"
        widget: "markdown"
        required: true
        hint: "Scrivi qui il testo. Usa ## per i titoli, **grassetto** per evidenziare."
